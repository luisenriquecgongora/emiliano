[package]
name = "emiliano-desktop"
version = "0.3.0"
description = "Emiliano desktop cowork app (Tauri shell around the Python engine)"
authors = ["Luis Enrique"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
