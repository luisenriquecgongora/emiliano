name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-engine-check:
    name: Python Engine Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e "./packages/engine[dev]"

      - name: Run CLI sanity checks
        run: |
          python -m emiliano.cli --help
          python -m emiliano.cli harnesses

  typescript-desktop-check:
    name: Desktop UI & Protocol Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck Desktop App
        run: yarn workspace @emiliano/desktop tsc --noEmit
