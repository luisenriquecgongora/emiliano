name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  python-engine-check:
    name: Python Engine Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e "./packages/engine[dev]" packaging

      - name: Lint (ruff, rules in ruff.toml)
        run: ruff check packages/engine scripts

      - name: Run engine tests
        working-directory: packages/engine
        run: python -m pytest tests -q

      - name: Run release retention tests
        run: python -m unittest scripts/test_prune_r2_releases.py

      - name: Run CLI sanity checks
        run: |
          python -m emiliano.cli --help
          python -m emiliano.cli harnesses

  typescript-desktop-check:
    name: Desktop UI & Protocol Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck Desktop App
        run: yarn workspace @emiliano/desktop tsc --noEmit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
