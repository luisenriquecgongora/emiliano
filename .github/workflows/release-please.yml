name: Release PR

# Keeps a release PR open on main with the next version and changelog, built
# from conventional commits. Merging it tags the release and starts release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed with GITHUB_TOKEN does not start other workflows, so start
      # the build explicitly, on the new tag so the GitHub Release gets assets.
      - name: Build and publish the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run release.yml --repo "${{ github.repository }}"
          --ref "${{ steps.release.outputs.tag_name }}"
          -f version="${{ steps.release.outputs.version }}"
