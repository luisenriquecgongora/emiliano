[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emiliano"
version = "0.1.0"
description = "Unified Meta-Harness & Autonomous Desktop Cowork Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Emiliano AI Contributors" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "loguru>=0.7.2",
    "pywinpty>=2.0.13; sys_platform == 'win32'",
    "pyautogui>=0.9.54",
    "pillow>=10.3.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
emiliano = "emiliano.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["emiliano"]
