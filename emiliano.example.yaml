# Emiliano Configuration File (emiliano.yaml)
# Copy this file to emiliano.yaml or ~/.emiliano/config.yaml

models:
  # Default provider: "ollama" | "anthropic" | "openai" | "deepseek"
  default_provider: "ollama"

  # Local Ollama endpoint
  ollama_base_url: "http://localhost:11434"

  # Context window (tokens) Emiliano asks Ollama for, and fits conversations into.
  # Ollama's own default is small and silently drops the start of long prompts.
  # Bigger needs more memory: 8192 suits most GPUs; try 32768 with 16 GB+ of VRAM.
  ollama_num_ctx: 8192

  # Load the local model when the engine (desktop app) or `emiliano chat` starts, so the first reply does
  # not wait ~15 s for it. The model then holds memory even if you never use it; false = load on first use.
  preload_local_model: true

  # Default model names
  local_model: "qwen2.5-coder:32b"
  remote_model: "claude-opus-5-5"

  # Automated fallback chain: tried top to bottom
  fallback_chain:
    - "ollama/qwen2.5-coder:32b"
    - "deepseek/deepseek-chat"
    - "anthropic/claude-opus-5-5"

harnesses:
  # Binary or command names for external harnesses
  claude_code_cmd: "claude"
  antigravity_cmd: "agy"
  opencode_cmd: "opencode"
  codex_cmd: "codex"

  # Agent Client Protocol (ACP) adapters. When the binary is installed, the harness runs over ACP:
  # tool calls stream to the dock and permission requests show Approve/Deny buttons there.
  # Set to null to keep plain CLI mode.
  claude_code_acp_cmd: "claude-agent-acp"   # npm install -g @agentclientprotocol/claude-agent-acp
  codex_acp_cmd: "codex-acp"
  opencode_acp_cmd: null                    # "opencode acp" to enable

  # Plain CLI runs (no ACP) pass --dangerously-* flags so they never wait for an approval.
  # false keeps each CLI's own approval and sandbox defaults.
  unattended_fallback: true

server:
  host: "127.0.0.1"
  port: 8765
  mutex_port: 51838

# MCP servers (stdio) whose tools local and API models can use; ACP harnesses get them too.
# Check them with `emiliano mcp` (or /mcp in the chat).
# mcp_servers:
#   filesystem:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
#   github:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-github"]
#     env: {GITHUB_PERSONAL_ACCESS_TOKEN: "<token>"}

cowork:
  # Screenshots for vision models when operating windows: "local" = only local Ollama models that report
  # vision (the screen never leaves this machine), "always" = cloud vision models too, "never" = text only
  vision: "local"
